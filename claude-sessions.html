<!doctype html><meta charset=utf-8><title>Claude Code sessions</title>
<style>
  :root { color-scheme: light dark; --line: color-mix(in srgb, currentColor 16%, transparent);
          --dim: color-mix(in srgb, currentColor 55%, transparent);
          --bg: Canvas; --fg: CanvasText }   /* the browser paints the canvas behind the page, not on it, so a
                              sticky element inherits nothing - name it to reuse it */
  * { box-sizing: border-box }
  body { background: var(--bg);
         font: 15px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 2rem 2.5rem 4rem;
         font-variant-numeric: tabular-nums }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 1rem }
  h1 small { font-weight: 400; color: var(--dim) }
  h2 { font-size: .9rem; font-weight: 600; margin: 2.2rem 0 .7rem;
       display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap }
  h2 small { font-weight: 400; font-size: .78rem; color: var(--dim) }

  .bar { display: flex; flex-wrap: wrap; gap: .6rem; margin: 0 0 1.2rem }
  .stat { border: 1px solid var(--line); border-radius: .5rem; padding: .5rem .85rem; min-width: 8.5rem }
  .stat b { display: block; font-size: 1.15rem; font-weight: 600; letter-spacing: -.01em }
  .stat span { font-size: .74rem; color: var(--dim) }
  /* today measured against the daily target. Scoped to .stat - a bare .hot/.warn would collide
     with the quota bands, which is exactly how the .q bug happened. */
  .stat b.ok { color: #4c9a5a } .stat b.warn { color: #d99a45 } .stat b.hot { color: #c9584f }
  .stat i { display: block; font-style: normal; font-size: .7rem; color: var(--dim);
            margin-top: .15rem; opacity: .85 }

  .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.4rem; font-size: .8rem;
            padding: 0 0 1.2rem; border-bottom: 1px solid var(--line); margin-bottom: .5rem }
  .key { display: flex; align-items: baseline; gap: .4rem }
  .key > span:last-child { color: var(--dim) }

  .grid { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fit, minmax(16rem, 21rem)) }
  .tile { position: relative;
          border: 1px solid var(--c, var(--line)); border-radius: .6rem; padding: .85rem .95rem 1.6rem;
          background: color-mix(in srgb, var(--c) 5%, transparent);
          cursor: pointer; transition: transform .08s ease, background .15s }
  .tile:hover { transform: translateY(-2px); background: color-mix(in srgb, var(--c) 14%, transparent) }
  .tile.dead { opacity: .4; border-style: dashed }

  .name { font-size: .95rem; font-weight: 600; display: flex; align-items: center; gap: .45rem;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: .1rem }
  .name span.txt { overflow: hidden; text-overflow: ellipsis }
  .kill { flex: none; font: inherit; font-size: .68rem; cursor: pointer; margin-left: .3rem;
          background: none; border: 1px solid var(--line); border-radius: .25rem;
          color: #c9584f; padding: .05rem .35rem; opacity: 0; transition: opacity .15s }
  .tile:hover .kill { opacity: 1 }
  .kill:hover { border-color: #c9584f; background: color-mix(in srgb, #c9584f 12%, transparent) }
  /* in the name row this truncated the session name, so float it in the corner instead;
     it hides on hover to make room for the compact/kill buttons */
  .wait { position: absolute; top: .55rem; right: .6rem; z-index: 1;
          font-size: .64rem; padding: .1rem .45rem; border-radius: 999px;
          transition: opacity .15s; white-space: nowrap;
          border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
          background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c) }
  .tile:hover .wait { opacity: 0; pointer-events: none }
  .wait.stall { border-color: #c9584f; color: #c9584f;
                background: color-mix(in srgb, #c9584f 16%, transparent) }
  .wait.fresh { animation: breathe 2.2s ease-in-out infinite }
  @keyframes breathe { 50% { opacity: .45 } }
  @media (prefers-reduced-motion: reduce) { .wait.fresh { animation: none } }
  .cmd { flex: none; font: inherit; font-size: .68rem; cursor: pointer;
         border: 1px solid var(--line); border-radius: .3rem; padding: .05rem .4rem;
         background: transparent; color: var(--dim); opacity: 0; transition: opacity .15s }
  .tile:hover .cmd, .cmd.armed { opacity: 1 }
  .talk { position: absolute; right: .6rem; bottom: .5rem; font: inherit; font-size: .68rem;
          cursor: pointer; border: 1px solid var(--line); border-radius: .25rem;
          padding: .05rem .45rem; background: var(--bg); color: var(--dim);
          opacity: 0; transition: opacity .15s }
  .tile:hover .talk { opacity: 1 }
  .talk[disabled] { cursor: not-allowed }
  .tile:hover .talk[disabled] { opacity: .35 }
  .cmd.armed { color: var(--c); border-color: var(--c) }
  .dot { font-size: .62em; line-height: 1; color: var(--c) }
  .busy { --c: #d99a45 } .idle { --c: #4c9a5a } .stale { --c: #8b8b8b } .unknown { --c: #6b8fd4 }
  .blocked { --c: #a07cc6 }
  .sub { font-size: .76rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .sub .old { opacity: .6; font-style: italic }
  .sub .kind { border: 1px solid var(--line); border-radius: .25rem; padding: 0 .3rem;
               font-size: .92em }
  .guess { font-style: normal; opacity: .45; padding-left: .1em }

  .ctx { margin: .7rem 0 .55rem }
  .ctx .row { display: flex; justify-content: space-between; font-size: .78rem; margin-bottom: .25rem }
  .ctx .row b { font-weight: 600 }
  .ctxbar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden }
  .ctxbar i { display: block; height: 100%; background: var(--c) }

  dl { margin: 0; font-size: .8rem; border-top: 1px solid var(--line); padding-top: .5rem }
  dl div { display: flex; justify-content: space-between; gap: 1rem; line-height: 1.7 }
  dl dt { color: var(--dim) } dl dd { margin: 0; font-weight: 500 }
  .counts { font-size: .76rem; color: var(--dim); border-top: 1px solid var(--line);
            margin-top: .5rem; padding-top: .5rem }
  .tools { font-size: .73rem; color: var(--dim); margin-top: .3rem;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

  /* every rule here stays scoped to #quota - a bare .q once collided with the window
     marker and the card prompt line, and silently dimmed this whole section to 45% */
  #quota { display: flex; flex-wrap: wrap; gap: 1.4rem; margin: .2rem 0 1rem }
  #quota .q { min-width: 13rem; flex: 1 1 13rem; max-width: 22rem }
  #quota .qh { display: flex; justify-content: space-between; font-size: .82rem; margin-bottom: .25rem }
  #quota .qh b { font-variant-numeric: tabular-nums }
  /* Text stays neutral like the cards. The status colour lives on the bar (and --qc), so
     it never becomes currentColor here - --dim is currentColor at 55%, so tinting the
     block would tint its own labels. */
  #quota .qh span, #quota .qh b { color: var(--fg) }
  #quota .track { height: .5rem; border-radius: .25rem; background: var(--line) }
  #quota .fill { height: 100%; border-radius: .25rem; background: var(--qc) }
  #quota .rst { font-size: .74rem; color: var(--dim); margin-top: .25rem }
  #quota .normal { --qc: #4c9a5a } #quota .warn { --qc: #d99a45 } #quota .hot { --qc: #c9584f }
  #quota .warn .qh b, #quota .hot .qh b { color: var(--qc) }   /* colour back on the number when it matters */
  #quota .err { color: var(--dim); font-size: .82rem }

  .what { margin: .5rem 0 .1rem; font-size: .82rem; line-height: 1.45 }
  .what .ask { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
             overflow: hidden; color: var(--fg) }
  .what .a { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
             overflow: hidden; color: var(--dim); margin-top: .3rem }
  .what .lead { color: var(--dim); font-weight: 600 }
  .doing { font-size: .78rem; color: var(--c); margin-top: .3rem; font-weight: 600 }

  .mail { position: fixed; left: 0; top: 0; z-index: 50; font-size: 6rem; line-height: 1; pointer-events: none;
           margin: -3rem 0 0 -3rem;                                  /* centre the glyph on the flight path */
           color: #6b8fd4; filter: drop-shadow(0 0 18px color-mix(in srgb, #6b8fd4 70%, transparent)) }
  .trail { position: fixed; z-index: 49; height: 3px; transform-origin: 0 50%; pointer-events: none;
           background: linear-gradient(90deg, transparent, #6b8fd4); opacity: .55 }
  .tile.landed { animation: land .9s ease-out }
  @keyframes land { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, #6b8fd4 70%, transparent) }
                  100% { box-shadow: 0 0 0 14px transparent } }
  @media (prefers-reduced-motion: reduce) { .mail, .trail { display: none } }

  details.more { margin-top: .5rem; border-top: 1px solid var(--line); padding-top: .4rem }
  details.more > summary { cursor: pointer; font-size: .76rem; color: var(--dim); list-style: none;
                           user-select: none; padding: .1rem 0 }
  details.more > summary::-webkit-details-marker { display: none }
  details.more > summary::before { content: '▸ '; display: inline-block; transition: transform .15s }
  details.more[open] > summary::before { transform: rotate(90deg) }
  details.more > summary:hover { color: var(--fg) }

  #top { position: sticky; top: 0; z-index: 40; background: var(--bg);
         padding-top: .6rem; margin-bottom: .6rem;
         box-shadow: 0 6px 12px -8px rgba(0,0,0,.45) }
  #top h1 { margin-top: 0 }
  h2 { position: sticky; top: var(--toph, 0px); z-index: 30; background: var(--bg) }

  #budget { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem 1.5rem;
            border: 1px solid var(--line); border-radius: .5rem; padding: .5rem .85rem;
            margin: .1rem 0 .8rem; font-size: .82rem }
  #budget .lead { font-weight: 700; font-size: .92rem }
  #budget i { font-style: normal; color: var(--dim) }
  #budget b { font-variant-numeric: tabular-nums }
  #budget .over { color: #c9584f; font-weight: 700 }
  #budget .under { color: #4c9a5a; font-weight: 700 }
  #budget .cav { flex-basis: 100%; font-size: .72rem; color: var(--dim) }

  .note { position: fixed; z-index: 48; width: min(26rem, 84vw);
          max-height: min(22rem, 45vh); overflow-y: auto;      /* long body: scroll, never clip */
          overscroll-behavior: contain;
          border: 1px solid #6b8fd4; border-radius: .55rem; padding: .55rem .7rem .5rem;
          background: var(--bg); box-shadow: 0 10px 28px -10px rgba(0,0,0,.6);
          font-size: .82rem; line-height: 1.45 }
  .note .nh { font-size: .72rem; color: var(--dim); margin-bottom: .3rem; display: flex; gap: .4rem;
              align-items: baseline; white-space: nowrap; overflow: hidden }
  .note .nh span { overflow: hidden; text-overflow: ellipsis }
  .note .x { margin-left: auto; flex: none; cursor: pointer; font: inherit; font-size: .9rem;
             line-height: 1; background: none; border: 0; color: var(--dim); padding: 0 .1rem }
  .note .x:hover { color: #c9584f }
  .note .nh b { color: #6b8fd4 }
  .note .nh { position: sticky; top: 0; background: var(--bg); padding-bottom: .1rem }
  .note .clock { position: sticky; bottom: 0; height: 2px; background: #6b8fd4; margin: .45rem -.7rem -.5rem;
                 border-bottom-left-radius: .55rem; border-bottom-right-radius: .55rem }
  @media (prefers-reduced-motion: reduce) { .note { display: none } }

  /* longest wait first - the top row is whoever has been stuck longest, which is the point */
  #awaiting { margin: 1.4rem 0 0; border: 1px solid var(--line); border-radius: .6rem;
              padding: .6rem .8rem }
  #awaiting h3 { font-size: .8rem; font-weight: 700; margin: 0 0 .5rem }
  #awaiting h3 small { font-weight: 400; color: var(--dim); margin-left: .4rem }
  #awaiting .a { display: grid; grid-template-columns: 4.5rem 11rem 1fr; gap: .7rem;
                 padding: .3rem 0; font-size: .82rem; cursor: pointer; align-items: baseline }
  #awaiting .a:hover { background: color-mix(in srgb, currentColor 6%, transparent) }
  #awaiting .a + .a { border-top: 1px solid var(--line) }
  #awaiting .w { color: #d99a45; text-align: right; font-variant-numeric: tabular-nums }
  #awaiting .who { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  #awaiting .dead { color: var(--dim) }
  #spend, #habits { margin-top: 2.2rem; border-top: 1px solid var(--line); padding-top: 1rem }
  #spend > summary, #habits > summary { cursor: pointer; font-weight: 700; list-style: none; margin-bottom: .3rem }
  #spend > summary::-webkit-details-marker, #habits > summary::-webkit-details-marker { display: none }
  #spend > summary::before, #habits > summary::before { content: '▸ '; display: inline-block; transition: transform .15s }
  #spend[open] > summary::before, #habits[open] > summary::before { transform: rotate(90deg) }
  #spend > summary small, #habits > summary small { font-weight: 400; color: var(--dim); font-size: .8rem; margin-left: .5rem }
  /* the panel sits beside its project's tiles, so it scopes to the agents in that project */
  .gwrap { display: grid; grid-template-columns: minmax(0, 1fr) 600px; gap: 1rem; align-items: start }
  .gwrap.solo { grid-template-columns: 1fr }
  @media (max-width: 1200px) { .gwrap { grid-template-columns: 1fr } }
  .chat { border: 1px solid var(--line); border-radius: .6rem; padding: .55rem .7rem }
  .chat > summary { cursor: pointer; list-style: none; font-size: .78rem; font-weight: 600 }
  .chat > summary::-webkit-details-marker { display: none }
  .chat > summary::before { content: '▸ '; display: inline-block; transition: transform .15s }
  .chat[open] > summary::before { transform: rotate(90deg) }
  .chat > summary small { font-weight: 400; color: var(--dim); margin-left: .35rem }
  .chat .log { display: flex; flex-direction: column; gap: .6rem;
               margin-top: .6rem; max-height: 24rem; overflow-y: auto }
  .chat .who { font-size: .78rem; line-height: 1.45 }
  /* sender and recipient each get their own hue so neither reads as body text, and the pair
     is told apart at a glance. Blue is already the message colour on the flying note. The
     dark pair is too pale on white (2.4:1 for the amber), so each gets a darker shade there.
     The plain hex first is the fallback for a browser without light-dark(). */
  .chat .who .f { color: #6b8fd4; color: light-dark(#3f63a8, #6b8fd4) }
  .chat .who .r { color: #d99a45; color: light-dark(#96600f, #d99a45) }
  .chat .who .arr { color: var(--dim); margin: 0 .3rem }
  .chat .t { color: var(--dim); font-size: .7rem; margin-left: .35rem }
  .chat .blind { color: var(--dim); font-weight: 400 }
  .chat .mfull { font: inherit; font-size: .7rem; cursor: pointer; margin-left: .4rem;
                 border: 1px solid var(--line); border-radius: .3rem; padding: 0 .3rem;
                 background: transparent; color: var(--dim) }
  .chat .mfull:hover { color: inherit; border-color: color-mix(in srgb, currentColor 40%, transparent) }
  .chat .body.open { max-height: none }
  /* the message itself stays at full contrast - only the timestamp and the arrow are dim */
  .chat .body { font-size: .82rem; max-height: 5.4rem; overflow: hidden; margin-top: .1rem;
                overflow-wrap: anywhere }   /* a bare url in a narrow column would push the tiles */
  .chat .body p { margin: 0 0 .25rem }
  .chat .body pre { margin: .2rem 0; white-space: pre-wrap }
  .hgrid { display: grid; gap: 1.4rem 2.4rem; margin-top: .8rem;
           grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)) }
  .hgrid h3 { font-size: .78rem; margin: 0 0 .5rem; color: var(--dim); font-weight: 600 }
  .hcard.wide { grid-column: 1 / -1 }
  .brow { display: grid; grid-template-columns: var(--lab, 3.1rem) 1fr 3.2rem; align-items: center;
          gap: .5rem; font-size: .76rem; line-height: 1.7 }
  .hcard.labels { --lab: 9.5rem }        /* tool names need far more room than "00h" */
  .brow i { font-style: normal; color: var(--dim);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .brow .t { height: .52rem; border-radius: .26rem; background: var(--line) }
  .brow .t > b { display: block; height: 100%; border-radius: .26rem; background: #4c9a5a }
  .brow .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim) }
  .brow.peak .t > b { background: #d99a45 }
  .brow.part .t > b { opacity: .45 }
  .chips { display: flex; flex-wrap: wrap; gap: .35rem }
  .chip { font-size: .73rem; border: 1px solid var(--line); border-radius: 999px; padding: .1rem .55rem }
  .chip b { font-variant-numeric: tabular-nums }

  /* Lives outside #groups on purpose: tick() rebuilds every tile every 2s, which would
     eat the draft and the caret. Same lesson the compact arm taught. */
  #talk { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%); z-index: 60;
         width: min(52rem, calc(100vw - 3rem)); display: none;
         max-height: calc(100vh - 3rem); flex-direction: column;
         border: 1px solid var(--line); border-radius: .6rem; padding: .55rem .7rem;
         background: var(--bg); box-shadow: 0 8px 28px -10px rgba(0,0,0,.6) }
  #talk.on { display: flex }                       /* so the log can take the leftover height */
  #talk .to { font-size: .76rem; color: var(--dim); margin-bottom: .35rem;
             display: flex; justify-content: space-between; gap: 1rem }
  #talk .to b { color: var(--fg); font-weight: 600 }
  /* whether the session is actually doing anything, so a silent panel is not ambiguous */
  #talkstate { margin-left: .5rem; font-size: .66rem; padding: .1rem .45rem; border-radius: 999px;
               white-space: nowrap; color: var(--sc); vertical-align: .05em;
               border: 1px solid color-mix(in srgb, var(--sc) 45%, transparent);
               background: color-mix(in srgb, var(--sc) 16%, transparent) }
  #talkstate:empty { display: none }
  #talkstate::before { content: '●'; margin-right: .3rem; font-size: .8em }
  #talkstate.busy { --sc: #d99a45 }
  #talkstate.idle { --sc: #4c9a5a }
  #talkstate.gone { --sc: #8b8b8b }
  #talkstate.busy::before { animation: pulse 1.2s ease-in-out infinite }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .2 } }

  /* the header chip is easy to miss while reading, so say it again at the foot of the thread,
     where a chat app puts "typing" and where the eye already is */
  #talklog .working { color: #d99a45; font-size: .75rem; border-left-color: #d99a45 }
  #talklog .working b { color: inherit; font-weight: 600 }
  #talklog .working i { font-style: normal; letter-spacing: .1em }
  #talklog .working i span { animation: blink 1.2s infinite }
  #talklog .working i span:nth-child(2) { animation-delay: .2s }
  #talklog .working i span:nth-child(3) { animation-delay: .4s }
  @keyframes blink { 0%, 60%, 100% { opacity: .2 } 30% { opacity: 1 } }
  #talkclose { cursor: pointer; font: inherit; font-size: .95rem; line-height: 1; vertical-align: -.05em;
               background: none; border: 0; color: var(--dim); padding: 0 .1rem; margin-left: .25rem }
  #talkclose:hover { color: #c9584f }
  #talk .foot { display: flex; justify-content: space-between; align-items: center;
                margin-top: .4rem; font-size: .72rem; color: var(--dim) }
  #talksend { font: inherit; font-size: .76rem; cursor: pointer; padding: .15rem .8rem;
              border: 1px solid var(--line); border-radius: .3rem;
              background: transparent; color: var(--fg) }
  #talksend:hover { border-color: color-mix(in srgb, currentColor 45%, transparent) }
  #talklog { flex: 1; min-height: 0; overflow-y: auto; overflow-anchor: none; margin-bottom: .45rem;
            font-size: .8rem; line-height: 1.45; display: flex; flex-direction: column; gap: .55rem }
  #talklog:empty { display: none }
  #talklog .m { overflow-wrap: anywhere; white-space: pre-wrap }
  #talklog .m > :is(h4, ul, ol, pre) { white-space: normal }
  #talklog h4 { font-size: .82rem; margin: .5rem 0 .2rem; font-weight: 700 }
  #talklog ul, #talklog ol { margin: .2rem 0; padding-left: 1.2rem }
  #talklog li { margin: .1rem 0 }
  #talklog code { font-size: .92em; padding: 0 .25em; border-radius: .2rem;
                  background: color-mix(in srgb, currentColor 12%, transparent) }
  #talklog pre { margin: .35rem 0; padding: .4rem .55rem; overflow-x: auto;
                 border: 1px solid var(--line); border-radius: .35rem;
                 background: color-mix(in srgb, currentColor 7%, transparent) }
  #talklog pre code { background: none; padding: 0 }
  #talklog a { color: #6b8fd4 }
  /* ONLY the "who - when" line. A bare `.m i` also catches italics the agent wrote, shrinking
     words mid-sentence to 10px at 30% opacity - the same collision that dimmed the quota panel. */
  #talklog .m > i.hd { font-style: normal; font-size: .7rem; color: var(--dim);
                 display: block; margin-bottom: .2rem }
  #talklog .m i { font-style: italic }             /* emphasis in the message stays emphasis */
  #talklog .m + .m { border-top: 1px solid var(--line); padding-top: .55rem }
  /* who is speaking, carried by colour on the rail and the name. Blue is already "a message" in
     this app (the flying note, the chatter sender); green is already "a live session". Darker
     shades on light - the dark pair sits under 3:1 on white. */
  /* flex-shrink:1 in an overflowing column squashes the shortest items hardest - the tool line
     wanted 27px and was given 11. Nothing in a scrolling log should ever be compressed. */
  #talklog .m { border-left: 2px solid transparent; padding-left: .5rem; flex: none }
  #talklog .user { border-left-color: #6b8fd4; border-left-color: light-dark(#3f63a8, #6b8fd4) }
  #talklog .assistant { border-left-color: #4c9a5a; border-left-color: light-dark(#2f7a41, #4c9a5a) }
  #talklog .user > i.hd b { color: #6b8fd4; color: light-dark(#3f63a8, #6b8fd4) }
  #talklog .assistant > i.hd b { color: #4c9a5a; color: light-dark(#2f7a41, #4c9a5a) }
  #talklog .m > i.hd b { font-weight: 600 }
  /* the work between two things being said - deliberately quiet, it is scenery, not conversation */
  #talklog .tools { border-left-color: transparent; color: var(--dim); font-size: .72rem;
                    padding-top: .35rem; padding-bottom: .1rem }
  #talklog .cut { display: block; margin-top: .3rem; font-size: .7rem; color: var(--dim) }
  /* a message from another session: neither you nor this session, so it gets its own colour */
  #talklog .peer { border-left-color: #a07cc6; border-left-color: light-dark(#7a4fa0, #a07cc6);
                   color: var(--dim) }
  #talklog .peer > i.hd b { color: #a07cc6; color: light-dark(#7a4fa0, #a07cc6) }
  #talklog .peer b { color: var(--fg); font-weight: 400 }
  #talklog .assistant { color: var(--dim) }
  #talklog .assistant b { color: var(--fg); font-weight: 400 }
  #talklog .err { color: var(--dim) }
  /* height is set from scrollHeight on input, so a manual resize would only be overwritten */
  #talk textarea { width: 100%; resize: none; min-height: 2.2rem; height: 2.2rem; flex: none;
                  overflow-y: auto; font: inherit; font-size: .84rem;
                  color: var(--fg); background: transparent; border: 1px solid var(--line);
                  border-radius: .4rem; padding: .4rem .5rem }
  #talk textarea:focus { outline: none; border-color: color-mix(in srgb, currentColor 40%, transparent) }
  #toast { position: fixed; bottom: 1.4rem; left: 50%; transform: translateX(-50%);
           background: #1c1c1c; color: #f0f0f0; padding: .6rem 1rem; border-radius: .5rem;
           font-size: .82rem; opacity: 0; transition: opacity .2s; pointer-events: none }
  #toast.show { opacity: .96 }
</style>
<header id=top>
<h1>Claude Code sessions <small id=summary></small></h1>
<div class=bar id=bar></div>
<div id=quota></div>
<div id=budget></div>
<div class=legend id=legend></div>
</header>
<div id=awaiting></div>
<div id=groups></div>
<details id=spend open><summary>Tokens spent <small></small></summary><div class=hgrid></div></details>
<details id=habits open><summary>How you use Claude Code <small></small></summary><div class=hgrid></div></details>
<div id=talk>
  <div class=to><span>message <b id=talkto></b><span id=talkstate></span></span>
    <span>enter to send · esc to close <button id=talkclose title="close">&times;</button></span></div>
  <div id=talklog></div>
  <textarea id=talktext rows=1 maxlength=2000 placeholder="type a message…"></textarea>
  <div class=foot><span>shift+enter for a newline</span><button id=talksend>send</button></div>
</div>
<div id=toast></div>
<script>
const STATES = {
  busy:    'mid-turn, working right now',
  idle:    'alive, waiting for input',
  unknown: 'alive, never reported a status (SDK sessions)',
  stale:   'process gone - last known state',
  blocked: 'background job with no process - resume it with claude attach',
};
document.getElementById('legend').innerHTML = Object.entries(STATES).map(([k, v]) =>
  `<span class="key ${k}"><span class=dot>●</span><b>${k}</b><span>${v}</span></span>`).join('')
  + `<span class=key><span>· click any tile to jump to its terminal</span></span>`;

const esc = s => String(s ?? '').replace(/[<&"]/g, c => ({ '<': '&lt;', '&': '&amp;', '"': '&quot;' }[c]));

// Just enough markdown for what Claude actually writes back. Escaping happens FIRST and the
// patterns only ever run over already-escaped text, so no tag can be constructed from input;
// link hrefs are additionally restricted to http(s) so a javascript: url cannot get through.
// Code spans are lifted out before anything else and put back last, so markdown inside a
// snippet stays literal.
function md(raw) {
  const held = [];
  const hold = h => `\u0000${held.push(h) - 1}\u0000`;
  let t = esc(raw)
    .replace(/```[a-z]*\n?([\s\S]*?)```/gi, (_, c) => hold(`<pre><code>${c.replace(/\n+$/, '')}</code></pre>`))
    .replace(/`([^`\n]+)`/g, (_, c) => hold(`<code>${c}</code>`));

  const inline = l => l
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,
             (_, txt, href) => `<a href="${href}" target="_blank" rel="noopener noreferrer">${txt}</a>`)
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/(^|[\s(])_([^_\n]+)_/g, '$1<i>$2</i>');

  const out = [];
  let list = null;                                   // 'ul' | 'ol' | null
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null } };
  for (const line of t.split('\n')) {
    const head = line.match(/^(#{1,4})\s+(.*)$/);
    const bullet = line.match(/^\s*[-*+]\s+(.*)$/);
    const number = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (head) { closeList(); out.push(`<h4>${inline(head[2])}</h4>`) }
    else if (bullet || number) {
      const want = bullet ? 'ul' : 'ol';
      if (list !== want) { closeList(); out.push(`<${want}>`); list = want }
      out.push(`<li>${inline((bullet || number)[1])}</li>`);
    }
    else if (!line.trim()) { closeList(); out.push('') }
    else { closeList(); out.push(inline(line)) }
  }
  closeList();
  return out.join('\n').replace(/\u0000(\d+)\u0000/g, (_, i) => held[+i]);
}
const tilde = p => (p || '').replace(/^\/Users\/[^/]+/, '~');
const label = p => tilde(p).split('/').filter(Boolean).pop() || '~';
const k = n => !n ? '0' : n < 1e3 ? String(n) : n < 1e6 ? (n / 1e3).toFixed(n < 1e4 ? 1 : 0) + 'k'
                                              : n < 1e9 ? (n / 1e6).toFixed(n < 1e7 ? 2 : 1) + 'M'
                                              : (n / 1e9).toFixed(2) + 'B';
const ago = ms => { const s = (Date.now() - ms) / 1e3;
  return s < 60 ? `${s|0}s` : s < 3600 ? `${s/60|0}m` : s < 86400 ? `${s/3600|0}h` : `${s/86400|0}d` };
const row = (dt, dd) => `<div><dt>${dt}</dt><dd>${dd}</dd></div>`;

function what(u, state) {
  if (!u) return '';
  const head = u.summary || u.lastUser;
  return `<div class=what>${
    head ? `<div class=ask><span class=lead>${u.summary ? 'topic' : 'asked'}</span> ${esc(head)}</div>` : ''}${
    u.lastAssistant ? `<div class=a>${esc(u.lastAssistant)}</div>` : ''}${
    state === 'busy' && u.lastTool
      ? `<div class=doing>⚙ ${esc(u.lastTool.replace(/^mcp__[^_]+__/, ''))} · ${ago(u.lastToolAt)} ago</div>` : ''}
  </div>`;
}

// --- session -> session messages: fly an envelope between the two tiles -------------
const seenMsg = new Set();
let firstFlight = true;                       // don't replay the whole backlog on load
document.addEventListener('visibilitychange', () => {
  if (document.hidden) document.querySelectorAll('.mail, .trail').forEach(e => e.remove());
});

const centre = pid => {
  const el = document.querySelector(`.tile[data-pid="${pid}"]`);
  if (!el) return null;
  const b = el.getBoundingClientRect(), m = 24;
  // a tile below the fold would send the envelope off into nowhere - clamp to the viewport edge
  return { el, offscreen: b.bottom < 0 || b.top > innerHeight,
    x: Math.max(m, Math.min(innerWidth - m, b.left + b.width / 2)),
    y: Math.max(m, Math.min(innerHeight - m, b.top + b.height / 2)) };
};

let openNotes = 0;
function openNote(x, y, from, to, text) {
  const words = String(text).trim().split(/\s+/).length;
  const ms = Math.min(20e3, Math.max(8e3, words / 3.3 * 1e3 + 2e3));   // ~200wpm + a beat
  const n = document.createElement('div');
  n.className = 'note';
  n.innerHTML = `<div class=nh><span>✉ <b>${esc(from)}</b> → ${esc(to)}</span>`
              + `<button class=x title="close">×</button></div>`
              + `<div>${esc(text)}</div><div class=clock></div>`;
  document.body.append(n);

  // land on the tile, but never off-screen - x/y are already clamped to the viewport
  const b = n.getBoundingClientRect(), m = 12, stack = (openNotes++ % 4) * 16;
  n.style.left = Math.max(m, Math.min(innerWidth - b.width - m, x - b.width / 2)) + 'px';
  n.style.top = Math.max(m, Math.min(innerHeight - b.height - m, y - b.height / 2 + stack)) + 'px';

  n.animate([{ opacity: 0, transform: 'scale(.7)' }, { opacity: 1, transform: 'scale(1)' }],
    { duration: 220, easing: 'ease-out' });
  const clock = n.querySelector('.clock').animate([{ width: '100%' }, { width: '0%' }],
    { duration: ms, easing: 'linear' });

  let t = setTimeout(close, ms);
  function close() {
    if (!n.isConnected) return;
    openNotes--; clearTimeout(t);
    n.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200 }).onfinish = () => n.remove();
  }
  // hovering to read (or select the text) shouldn't race the countdown
  n.onmouseenter = () => { clearTimeout(t); clock.pause() };
  n.onmouseleave = () => { clock.play(); t = setTimeout(close, ms - clock.currentTime) };
  n.querySelector('.x').onclick = close;
}

function fly(from, to, label, text) {
  const a = centre(from), b = centre(to);
  if (!a || !b) return;                       // sender or receiver not on screen - skip
  const dx = b.x - a.x, dy = b.y - a.y;
  const dist = Math.hypot(dx, dy), deg = Math.atan2(dy, dx) * 180 / Math.PI;
  const arc = Math.min(120, dist * .22);      // lift the midpoint so it curves

  const trail = document.createElement('div');
  trail.className = 'trail';
  trail.style.cssText += `left:${a.x}px;top:${a.y}px;width:${dist}px;transform:rotate(${deg}deg)`;
  const mail = document.createElement('div');
  mail.className = 'mail';
  mail.textContent = '✉';
  mail.title = label || '';
  document.body.append(trail, mail);

  const dur = Math.min(1600, 600 + dist);
  mail.animate([
    { transform: `translate(${a.x}px, ${a.y}px) scale(.5)`, opacity: 0 },
    { transform: `translate(${a.x + dx * .5}px, ${a.y + dy * .5 - arc}px) scale(1)`, opacity: 1, offset: .5 },
    { transform: `translate(${b.x}px, ${b.y}px) scale(.5)`, opacity: 0 },
  ], { duration: dur, easing: 'ease-in-out' });
  trail.animate([{ opacity: 0 }, { opacity: .55, offset: .4 }, { opacity: 0 }],
    { duration: dur, easing: 'ease-out' });

  setTimeout(() => {
    mail.remove(); trail.remove();
    if (text) openNote(b.x, b.y, ...String(label).split(' → '), text);   // b is clamped, so still visible
    if (b.offscreen || !b.el.isConnected) return;
    b.el.classList.add('landed');
    setTimeout(() => b.el.classList.remove('landed'), 900);
  }, dur);
}

function flights(sessions) {
  // a hidden tab freezes animations; flying now would just pile up invisible elements and
  // burn the message. leave them unseen - they replay when the tab comes back.
  if (document.hidden) return;
  const name = new Map(sessions.map(s => [s.pid, s.name]));
  for (const s of sessions) for (const m of s.usage?.inbox || []) {
    const key = `${s.pid}:${m.at}`;
    if (seenMsg.has(key)) continue;
    seenMsg.add(key);
    if (firstFlight || Date.now() - m.at > 12e4) continue;   // only animate genuinely fresh traffic
    fly(m.from, s.pid, `${name.get(m.from) || m.name || m.from} → ${s.name}`, m.text);
  }
  firstFlight = false;
}

const openTiles = new Set();
document.addEventListener('toggle', e => {
  const t = e.target.closest?.('.tile'); if (!t || !e.target.matches('details.more')) return;
  const id = t.dataset.pid ?? `job:${t.dataset.job}`;
  e.target.open ? openTiles.add(id) : openTiles.delete(id);
}, true);                                     // 'toggle' does not bubble - capture instead

// derived weekly budget: reported % paired with measured tokens
// Sessions that said what they are waiting on. This is the one piece of state on the page that
// is declared rather than inferred - `stalled` next door is a guess, this is the session's own word.
function renderAwaiting(list) {
  const box = document.getElementById('awaiting');
  if (!list?.length) { box.style.display = 'none'; return }
  box.style.display = '';
  box.innerHTML = `<h3>Awaiting <small>${list.length} session${list.length > 1 ? 's' : ''} · longest first</small></h3>`
    + list.map(a => `<div class=a data-pid="${a.pid}" title="waiting since ${
        esc(new Date(a.at).toLocaleString())}${a.alive ? '' : ' · session is gone'}">
        <span class=w>${ago(a.at)}</span>
        <span class="who${a.alive ? '' : ' dead'}">${esc(a.name || a.sessionId.slice(0, 8))}</span>
        <span>${esc(a.waitingFor)}</span>
      </div>`).join('');
}

function renderBudget(b) {
  const el = document.getElementById('budget'), w = b?.week;
  if (!w?.impliedFullWeek) {
    // vanishing without explanation looks like a bug; say why there is no budget
    if (!w?.note) { el.style.display = 'none'; return }
    el.style.display = 'flex';
    el.innerHTML = `<span class=lead>No weekly budget yet</span><span class=cav>${esc(w.note)}${
      w.tokensUsed ? ` · ${k(w.tokensUsed)} measured so far this window` : ''}</span>`;
    return;
  }
  el.style.display = 'flex';
  const reset = w.resetsAt && new Date(w.resetsAt), out = w.exhaustedAt && new Date(w.exhaustedAt);
  const over = out && reset && out < reset;                 // runs dry before the week rolls over
  const short = d => d.toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
  const gap = out && reset ? Math.abs(reset - out) / 36e5 : null;
  el.innerHTML = `
    <span class=lead>100% ≈ ${k(w.impliedFullWeek)} tokens this ${w.reAnchored ? 'window' : 'week'}</span>
    <span><b>${k(w.tokensUsed)}</b> <i>used (${w.percentUsed}%)</i></span>
    <span><b>${k(w.tokensRemaining)}</b> <i>left</i></span>
    <span><b>${k(w.runRatePerDay)}</b><i>/day run rate</i></span>
    <span><b>${k(w.projectedFullWeek)}</b> <i>projected =</i> <b class="${over ? 'over' : 'under'}">${w.projectedPercent}%</b></span>
    ${out ? `<span class="${over ? 'over' : 'under'}">${over ? `runs out ${short(out)}` : `resets first ${short(reset)}`}</span>
             <i>${gap != null ? `${gap < 24 ? Math.round(gap) + 'h' : Math.round(gap / 24) + 'd'} ${over ? 'before reset' : 'to spare'}` : ''}</i>` : ''}
    ${w.provisional ? `<span class=cav><b class=over>provisional</b> — only ${w.percentUsed}% reported
      so far, so this could move by about ±${w.swingPct}% on the next poll.</span>` : ''}
    ${w.reAnchored ? `<span class=cav>counting from ${new Date(w.anchoredAt).toLocaleString()}, when
      the reported percentage was observed to restart${w.anchorBackfilled ? ' (found in sample history)' : ''}
      — not from <i>resets_at</i> minus seven days, which this window is not.</span>` : ''}
    <span class=cav>derived: measured tokens ÷ reported %. Raw volume, dominated by cache reads — a
      relative yardstick, not Anthropic's own weighting.${w.exact ? '' : ' This week is approximate: no sample from week start.'}${
      w.percentIsLive ? '' : ` ${esc(w.note || '')}`}</span>`;
}

// Matches Claude Code's own idle_prompt notification: quiet for at least the configured
// threshold (default 60s), not merely idle.
let IDLE_MS = 60e3, DEF_MODEL = null;
// tick() rebuilds every tile every 2s, so an 'armed' class on the button is wiped
// mid-decision - the second click then re-arms instead of sending. Keep it out here.
let armed = null, armTimer = 0;
let talkPid = null, talkTimer = 0;         // which session the composer is aimed at

// Nothing on disk records a session's context window: transcripts log the resolved model
// name with the [1m] suffix stripped ("claude-opus-5" whether it is 200k or 1M) and the
// registry carries no model at all. Two things are knowable: more than 200k of context in
// play can only be a 1M window, and the configured default says what a session started as.
// A session switched with /model since launch is invisible, so say so rather than guess.
const family = m => String(m || '').replace(/^claude-/, '').split(/[-[]/)[0];
const windowOf = u => u && u.ctx > 2e5
  ? { win: 1e6, why: 'over 200k in play — this can only be a 1M window' }
  : { win: /\[1m\]$/.test(DEF_MODEL || '') && family(u?.model) === family(DEF_MODEL) ? 1e6 : 2e5,
      guess: `not recorded per session — assumed from your default model (${DEF_MODEL || 'unset'}). `
           + 'A /model switch inside the session would not show here.' };
const waiting = r => r.alive && r.status === 'idle' && r.statusUpdatedAt > 0
                  && Date.now() - r.statusUpdatedAt >= IDLE_MS;

// A permission prompt happens mid-turn, so the session still reports busy. Claude Code
// writes no blocked state anywhere, but a blocked session is busy while writing nothing
// and burning nothing - that gap is the only local signal there is.
const stalled = r => r.alive && r.status === 'busy' && r.usage?.lastAt
                  && Date.now() - r.usage.lastAt >= IDLE_MS && !r.usage.burn;

// `kind` in the registry is write-once at launch: attach a bg session and it still says
// "bg"; park an interactive one behind a job and it still says "interactive". What is true
// right now is whether the process holds a tty.
const kindOf = r =>
  r.headless ? 'bg'
  : r.kind === 'bg' ? 'bg · attached'
  : r.parkedJobId ? 'parked'
  : 'interactive';

const kindWhy = r =>
  r.headless ? `started with claude --bg and has no terminal (tty ${r.tty || '?'}) - `
             + `nothing can be typed into it. Reach it with: claude attach ${r.jobId || ''}`
  : r.kind === 'bg' ? `started with claude --bg but is attached to ${r.tty}, so it can be typed into`
  : r.parkedJobId ? `an ordinary session, currently parked behind background job ${r.parkedJobId} on ${r.tty}`
  : `an ordinary session in a terminal tab on ${r.tty}`;

function tile(r) {
  // a background job has no process, but it is not stale either - it is parked and resumable,
  // so it keeps its own state rather than being painted as a dead session
  const state = r.job ? (r.status === 'blocked' ? 'blocked' : 'unknown')
                      : !r.alive ? 'stale' : (r.status || 'unknown');
  const id = r.pid ?? `job:${r.job}`;               // pid is the key everywhere else
  const u = r.usage;
  const { win, why, guess } = windowOf(u);
  // model and effort only exist on assistant replies, so they are as old as the last one
  const oldCfg = u?.modelAt && u.lastAt - u.modelAt > 6e4;
  const top = u ? Object.entries(u.byTool).sort((a, b) => b[1] - a[1]).slice(0, 3)
                  .map(([n, c]) => `${n.replace(/^mcp__[^_]+__/, '')} ${c}`).join('  ·  ') : '';
  return `<div class="tile ${state} ${r.alive || r.job ? '' : 'dead'}"${
       r.pid ? ` data-pid="${r.pid}"` : ` data-job="${esc(r.job)}"`}
       title="${esc(r.sessionId)}\n${esc(r.cwd)}\n${r.job
         ? `background job - no terminal to focus. Open it with: claude attach ${esc(r.job)}`
         : 'click to focus this terminal'}">
    <div class=name><span class=dot>●</span><span class=txt>${esc(r.name || r.sessionId?.slice(0, 8))}</span>${
      stalled(r) ? `<span class="wait stall fresh"
                    title="busy, but nothing written and no tokens burned for ${ago(r.usage.lastAt)} — most likely sitting on a permission prompt"
                    >stalled ${ago(r.usage.lastAt)}</span>`
      : waiting(r) ? `<span class="wait ${Date.now() - r.statusUpdatedAt < 36e5 ? 'fresh' : ''}"
                    title="quiet for ${ago(r.statusUpdatedAt)} — Claude Code has notified you it is waiting for input"
                    >waiting ${ago(r.statusUpdatedAt)}</span>` : ''}${
      r.alive ? `<button class="cmd ${armed === r.pid + ':compact' ? 'armed' : ''}" data-cmd=compact>${
                   armed === r.pid + ':compact' ? '/compact?' : 'compact'}</button>
                 <button class=kill title="send SIGTERM to pid ${r.pid}">kill</button>` : ''}</div>
    <div class=sub>${state}${r.alive ? ` · <span class=kind title="${esc(kindWhy(r))}">${
      esc(kindOf(r))}</span>` : ''}${r.job
        ? ` · <span class=kind title="a background job, not a terminal session. claude attach ${
            esc(r.job)}">bg job ${esc(r.job)}</span>`
        : ` · pid ${r.pid}`}${
      r.startedAt ? ` · up ${ago(r.startedAt)}` : ''}${
      u?.lastAt ? ` · active ${ago(u.lastAt)} ago` : ''}</div>
    <div class=sub>${esc((u?.model || r.version || '').replace('claude-', ''))}${
      u?.effort ? ` · ${esc(u.effort)}` : ''}${
      oldCfg ? ` <span class=old title="from the last assistant reply — there has been newer activity since, so a change you just made will not show until this session next replies">as of ${ago(u.modelAt)} ago</span>` : ''}${
      u?.branch && u.branch !== 'HEAD' ? ` · ⑂ ${esc(u.branch)}` : ''}</div>
    ${r.needs ? `<div class=what><div class=ask><span class=lead>blocked on</span> ${
      esc(r.needs)}</div></div>` : ''}
    ${what(u, state)}
    ${u ? `
    <div class=ctx>
      <div class=row><span>context</span><b title="${esc(why || guess)}">${k(u.ctx)} / ${
        win === 1e6 ? '1M' : '200k'}${guess ? '<i class=guess>?</i>' : ''}</b></div>
      <div class=ctxbar><i style="width:${Math.min(100, u.ctx / win * 100)}%"></i></div>
    </div>
    <dl>
      ${row('burning (5m)', k(u.burn))}
      ${row('<b>all tokens</b>', '<b>' + k(u.total) + '</b>')}
    </dl>
    <details class=more ${openTiles.has(String(id)) ? 'open' : ''}>
      <summary>breakdown</summary>
      <dl>
        ${row('output', k(u.tok.output))}
        ${row('input', k(u.tok.input))}
        ${row('cache read', k(u.tok.cacheRead))}
        ${row('cache write', k(u.tok.cacheWrite))}
        ${row('thinking', k(u.tok.thinking))}
      </dl>
      <div class=counts>${u.turns} turns · ${u.msgs} replies · ${u.tools} tool calls${
        u.sidechain ? ` · ${u.sidechain} subagent` : ''}</div>
      ${top ? `<div class=tools>${esc(top)}</div>` : ''}
    </details>` : ''}
    ${!r.alive ? '' : r.headless
      ? `<button class=talk disabled title="${esc(kindWhy(r))}">talk</button>`
      : `<button class=talk title="chat with this session">talk</button>`}
  </div>`;
}

const QLABEL = l => l.kind === 'session' ? '5-hour session'
  : l.kind === 'weekly_all' ? 'Weekly (all models)'
  : l.kind === 'weekly_scoped' ? `Weekly (${l.scope?.model?.display_name || 'scoped'})`
  : l.kind;

function until(iso) {
  if (!iso) return '';
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return 'resetting…';
  const h = Math.floor(ms / 36e5), m = Math.round(ms % 36e5 / 6e4);
  return `resets in ${h ? h + 'h ' : ''}${m}m · ${new Date(iso).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })}`;
}

function renderQuota(q) {
  const el = document.getElementById('quota');
  if (!q || q.error) return el.innerHTML = `<div class="q err">plan usage unavailable — ${esc(q?.error || 'no data')}</div>`;
  const limits = (q.limits || []).filter(l => l.percent != null && (l.kind !== 'weekly_scoped' || l.percent > 0));
  el.innerHTML = limits.map(l => {
    const p = Math.min(100, l.percent);
    const cls = p >= 90 ? 'hot' : p >= 70 ? 'warn' : 'normal';
    return `<div class="q ${cls}">
      <div class=qh><span>${esc(QLABEL(l))}</span><b>${p}%</b></div>
      <div class=track><div class=fill style="width:${p}%"></div></div>
      <div class=rst>${esc(until(l.resets_at))}</div>
    </div>`;
  }).join('') + (q.extra_usage?.is_enabled
    ? `<div class="q normal"><div class=qh><span>Extra usage</span><b>${q.extra_usage.utilization ?? 0}%</b></div></div>` : '');
}

// --- usage patterns: slow-moving, so on its own 60s cycle rather than the 2s poll --------
const bars = (pairs, fmt = k => k, vfmt = k2, mark = () => null) => {
  const max = Math.max(...pairs.map(p => p[1]), 1);
  return pairs.map(([k, v]) => {
    const m = mark(k);                                        // [extraClass, tooltip] or null
    return `<div class="brow ${v === max ? 'peak' : ''} ${m?.[0] || ''}" title="${esc(m?.[1] || '')}">
      <i>${esc(fmt(k))}</i>
      <span class=t><b style="width:${v / max * 100}%"></b></span>
      <span class=n>${v ? vfmt(v) : ''}</span></div>`;
  }).join('');
};
const k2 = n => n < 1000 ? String(n) : (n / 1000).toFixed(1) + 'k';

async function renderHabits() {
  let h; try { h = await (await fetch('/patterns')).json() } catch { return }
  const box = document.getElementById('habits');
  if (!h?.prompts) { box.style.display = 'none'; return }
  box.style.display = '';
  box.querySelector('summary small').textContent =
    `${h.prompts} prompts over ${h.activeDays} active days · ${h.promptsPerActiveDay}/day`;

  const hours = Object.entries(h.byHour).map(([k, v]) => [+k, v]).filter(([, v]) => v > 0);
  const hourRows = bars(hours, k => String(k).padStart(2, '0') + 'h');

  box.querySelector('.hgrid').innerHTML = `
    <div class="hcard wide"><h3>when you work — local hour</h3>${hourRows}</div>
    <div class=hcard><h3>by weekday</h3>${bars(Object.entries(h.byDow))}</div>
    <div class="hcard labels"><h3>tools you lean on</h3>${
      bars(h.topTools.map(([n, c]) => [n.replace(/^mcp__[^_]+__/, ''), c]))}</div>
    <div class=hcard><h3>how you prompt</h3>
      <div class=chips>
        <span class=chip>~<b>${h.avgPromptChars}</b> chars per prompt</span>
        <span class=chip><b>${h.interruptRate}%</b> of turns interrupted</span>
        ${h.concurrency ? `<span class=chip><b>${h.concurrency.median}</b> sessions at once (peak <b>${h.concurrency.max}</b>)</span>` : ''}
      </div>
      <h3 style="margin-top:.9rem">models</h3>
      <div class=chips>${h.models.map(([m, n]) => `<span class=chip>${esc(m.replace('claude-', ''))} <b>${k2(n)}</b></span>`).join('')}</div>
      <h3 style="margin-top:.9rem">effort</h3>
      <div class=chips>${h.effort.map(([e, n]) => `<span class=chip>${esc(e)} <b>${k2(n)}</b></span>`).join('') || '<span class=chip>—</span>'}</div>
    </div>`;
}
renderHabits();
setInterval(renderHabits, 60e3);

// --- tokens spent per day / per week ---------------------------------------------------
async function renderSpend() {
  let r; try { r = await (await fetch('/log')).json() } catch { return }
  const box = document.getElementById('spend');
  if (!r?.days?.length) { box.style.display = 'none'; return }
  box.style.display = '';

  const days = r.days.slice(0, 30).reverse();                  // oldest -> newest
  const partial = new Set(days.filter(d => d.partial).map(d => d.date));
  const total = r.days.reduce((n, d) => n + d.total, 0);
  box.querySelector('summary small').textContent =
    `${k(total)} over ${r.days.length} days · ${k(Math.round(total / r.days.length))}/day average`;

  const dayRows = bars(days.map(d => [d.date, d.total]), s => s.slice(5), k,
    s => partial.has(s) ? ['part', 'partial — predates the ledger, so it may undercount'] : null);
  const weekRows = bars((r.weekly || []).slice().reverse().map(w => [w.from, w.used]), s => s.slice(5), k,
    s => [null, `week of ${s}`]);

  box.querySelector('.hgrid').innerHTML = `
    <div class="hcard wide"><h3>per day — last ${days.length}</h3>${dayRows}</div>
    ${weekRows ? `<div class="hcard wide"><h3>per quota week</h3>${weekRows}</div>` : ''}`;
}
renderSpend();
setInterval(renderSpend, 60e3);

// --- session chatter ---------------------------------------------------------------
// Every session-to-session message is written twice: the sender logs a SendMessage tool_use
// (outbox) and the receiver logs a <cross-session-message> (inbox). The receiver's copy is
// canonical because it resolves BOTH ends to a pid, so each outbox entry is joined onto one
// inbox row. Whatever is left unjoined went somewhere this dashboard cannot see - a subagent,
// or a session whose transcript is gone - and is shown one-sided rather than dropped.
const FEED_MAX = 40, FEED_JOIN = 12e4;   // same join window correlate() uses server-side
function feedOf(sessions) {
  const withPid = sessions.filter(s => s.pid);     // background jobs have none, and would all
  const name = new Map(withPid.map(s => [s.pid, s.name]));   // collide on a single null key
  const cwdOf = new Map(withPid.map(s => [s.pid, s.cwd]));
  const byName = new Map();                  // a one-sided message names its recipient, no pid
  for (const s of sessions) if (!byName.has(s.name)) byName.set(s.name, s.cwd);
  const rows = [];
  for (const s of sessions) for (const m of s.usage?.inbox || [])
    rows.push({ at: m.at, fromPid: m.from, from: name.get(m.from) || m.name || `pid ${m.from}`,
                to: s.name, text: m.text || m.body || '',
                cwds: [cwdOf.get(m.from), s.cwd].filter(Boolean) });
  const used = new Set();
  for (const s of sessions) for (const o of s.usage?.outbox || []) {
    const hit = rows.find(r => !used.has(r) && r.fromPid === s.pid && Math.abs(r.at - o.at) < FEED_JOIN);
    if (hit) { used.add(hit); if (!hit.text) hit.text = o.summary || o.preview || '' }
    else rows.push({ at: o.at, fromPid: s.pid, from: s.name, to: o.to || 'unknown',
                     text: o.summary || o.preview || '', blind: true,
                     cwds: [s.cwd, byName.get(o.to)].filter(Boolean) });
  }
  // One message to four sessions is four rows, and two sessions sharing a name produce a
  // near-duplicate pair. Same sender, same text, close in time = one message; collect the
  // recipients onto a single row instead of repeating the body.
  const merged = [];
  for (const r of rows.sort((a, b) => b.at - a.at)) {
    const prev = r.text && merged.find(m => m.from === r.from && m.text === r.text
                                            && Math.abs(m.at - r.at) < FEED_JOIN);
    if (!prev) merged.push({ ...r, tos: [r.to], cwds: [...new Set(r.cwds)] });
    else {
      if (!prev.tos.includes(r.to)) prev.tos.push(r.to);
      for (const c of r.cwds) if (!prev.cwds.includes(c)) prev.cwds.push(c);
      prev.blind = prev.blind && r.blind;
    }
  }
  return merged;                             // capped per project, not globally
}

// A project's panel carries every message with one end in that project, so a message across
// two projects shows up in both - each side is chatter its own agents took part in.
const shutChat = new Set();                  // cwds the user collapsed; #groups is rebuilt every
const chatScroll = new Map();                // 2s, so neither survives in the DOM
document.addEventListener('toggle', e => {
  if (!e.target.matches?.('details.chat')) return;
  const cwd = e.target.dataset.cwd;
  e.target.open ? shutChat.delete(cwd) : shutChat.add(cwd);
}, true);
document.addEventListener('scroll', e => {
  const log = e.target.closest?.('.chat .log');
  if (log) chatScroll.set(log.parentElement.dataset.cwd, log.scrollTop);
}, true);

// The row shows the summary the sender wrote. /message fetches the body behind it on demand -
// it is not in the 2s payload. Both the toggle and the fetched text live out here, because
// #groups is rebuilt from scratch every tick.
const fullOpen = new Set(), fullText = new Map();
document.addEventListener('click', async e => {
  const b = e.target.closest?.('.mfull');
  if (!b) return;
  e.stopPropagation();
  const key = b.dataset.key;
  if (fullOpen.has(key)) { fullOpen.delete(key); return tick() }
  fullOpen.add(key);
  if (!fullText.has(key)) {
    b.textContent = '…';
    const [pid, at] = key.split(':');
    let r;
    try { r = await (await fetch(`/message?pid=${pid}&at=${at}&to=${encodeURIComponent(b.dataset.to)}`)).json() }
    catch { r = null }
    fullText.set(key, r?.ok ? r.text : `_${r?.error || 'could not read that message'}_`);
  }
  await tick();                              // the row is a new node now - find it again
  document.querySelector(`.mfull[data-key="${CSS.escape(key)}"]`)
    ?.closest('.m')?.scrollIntoView({ block: 'nearest' });   // keep the sender line in view
});

function chatterFor(cwd, feed) {
  const rows = feed.filter(r => r.cwds.includes(cwd)).slice(0, FEED_MAX);
  if (!rows.length) return '';
  const hour = rows.filter(r => Date.now() - r.at < 36e5).length;
  return `<details class=chat data-cwd="${esc(cwd)}"${shutChat.has(cwd) ? '' : ' open'}>
    <summary>chatter <small>${rows.length}${hour ? ` · ${hour} this hour` : ''}</small></summary>
    <div class=log>${rows.map(r => {
      const key = `${r.fromPid}:${r.at}`, open = fullOpen.has(key);
      return `<div class=m>
        <div class=who><b class=f>${esc(r.from)}</b><span class=arr>&rarr;</span><b class=r>${esc(
          r.tos.slice(0, 3).join(', ') + (r.tos.length > 3 ? ` +${r.tos.length - 3}` : ''))}</b>
          <span class=t title="${esc(new Date(r.at).toLocaleString())}">${ago(r.at)}</span>${
          r.blind ? '<span class=blind> &middot; not seen arriving</span>' : ''}
          <button class=mfull data-key="${key}" data-to="${esc(r.tos[0] || '')}"
                  title="${open ? 'back to the summary' : 'read the whole message'}">${
                  open ? 'less' : 'full'}</button></div>
        <div class="body${open ? ' open' : ''}">${md(open ? fullText.get(key) ?? '…' : r.text)}</div>
      </div>`;
    }).join('')}</div>
  </details>`;
}

async function tick() {
  const { sessions, awaiting, rollup, quota, budget, idleNotifMs, defaultModel } = await (await fetch('/api')).json();
  if (idleNotifMs > 0) IDLE_MS = idleNotifMs;
  DEF_MODEL = defaultModel || null;
  renderQuota(quota);
  renderBudget(budget);
  renderAwaiting(awaiting);
  const d0 = new Date(), today = rollup.days[new Date(d0 - d0.getTimezoneOffset() * 6e4).toISOString().slice(0, 10)] || {};
  const sum = f => sessions.reduce((n, s) => n + (s.usage ? f(s.usage) : 0), 0);

  const sug = budget?.week?.suggestedRatePerDay || 0;   // the daily budget today is measured against
  const allToday = (today.input || 0) + (today.output || 0) + (today.cacheWrite || 0) + (today.cacheRead || 0);
  // today against the rate that would land exactly on the reset. Over it means today is spending
  // faster than what is left can sustain - not that the week is lost, which is what the strip says.
  const todayPct = sug ? Math.round(allToday / sug * 100) : null;
  const todayCls = todayPct == null ? '' : todayPct >= 100 ? 'hot' : todayPct >= 80 ? 'warn' : 'ok';
  const wait = sessions.filter(waiting).length, stall = sessions.filter(stalled).length;
  document.getElementById('summary').textContent =
    `— ${sessions.filter(s => s.alive).length} live in ${new Set(sessions.map(s => s.cwd)).size} projects`
    + (wait ? ` · ${wait} waiting on you` : '') + (stall ? ` · ${stall} stalled` : '');
  document.getElementById('bar').innerHTML = [
    [k(sum(u => u.burn)), 'output, last 5 min', 'across every live session'],
    [k(sum(u => u.ctx)), 'held in context', 'sum of every session window'],
    [k(today.output), 'output today', 'account-wide, from transcripts'],
    [k(allToday), 'all tokens today',
      `${today.msgs || 0} model replies today`
        + (todayPct == null ? '' : `. That is ${todayPct}% of today's target. The target is what is `
           + `left of the week divided by the time left before the reset - spend that per day and `
           + `the quota runs out exactly as the week does.`),
      sug ? `target ${k(sug)}/day` : '', todayCls],
    [rollup.scanning ? `${rollup.done}/${rollup.files}` : String(rollup.sessions),
      rollup.scanning ? 'scanning…' : 'transcripts read',
      rollup.scanning ? 'reading every transcript once' : `updated ${new Date(rollup.at).toLocaleTimeString()}`],
  ].map(([val, lab, sub, ref, cls]) => `<div class=stat title="${esc(sub)}"><b${
      cls ? ` class=${cls}` : ''}>${val}</b><span>${lab}</span>${
      ref ? `<i>${esc(ref)}</i>` : ''}</div>`).join('');

  const by = new Map();
  for (const r of sessions) { if (!by.has(r.cwd)) by.set(r.cwd, []); by.get(r.cwd).push(r); }
  const tokens = r => r.usage?.total || 0;
  const spent = rs => rs.reduce((n, r) => n + tokens(r), 0);
  for (const rs of by.values()) rs.sort((a, b) => (b.alive - a.alive) || tokens(b) - tokens(a));
  const groups = [...by.entries()].sort((a, b) => spent(b[1]) - spent(a[1]));
  const feed = feedOf(sessions);
  document.getElementById('groups').innerHTML = groups.map(([cwd, rs]) => {
    const chat = chatterFor(cwd, feed);
    return `<h2>${esc(label(cwd))} <small>${esc(tilde(cwd))}</small>
      <small>${rs.length} session${rs.length > 1 ? 's' : ''} · ${k(spent(rs))} tokens</small></h2>
     <div class="gwrap${chat ? '' : ' solo'}">
       <div class=grid>${rs.map(tile).join('')}</div>${chat}</div>`;
  }).join('');
  for (const [cwd, top] of chatScroll) {      // innerHTML just reset every one of these
    const log = document.querySelector(`.chat[data-cwd="${CSS.escape(cwd)}"] .log`);
    if (log) log.scrollTop = top;
  }
  flights(sessions);
  document.documentElement.style.setProperty('--toph',
    document.getElementById('top').offsetHeight + 'px');
}

const toast = m => { const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600) };

const talkBox = () => document.getElementById('talk');

let threadSig = '';                                      // what the log is currently showing
async function loadThread() {
  const pid = talkPid, box = document.getElementById('talklog');
  if (pid == null) return;
  let r; try { r = await (await fetch('/thread?pid=' + pid)).json() } catch { return }
  if (talkPid !== pid) return;                            // composer moved on while we waited
  const st = document.getElementById('talkstate');
  if (!r.ok) { st.className = ''; st.textContent = ''; return box.innerHTML = `<div class=err>${esc(r.error)}</div>` }
  // busy means mid-turn, so anything you send now queues behind it - say so rather than leaving
  // the panel looking like nothing is happening
  const state = !r.alive ? 'gone' : r.status === 'busy' ? 'busy' : 'idle';
  st.className = state;
  st.textContent = state === 'busy' ? 'working — your message will queue'
                 : state === 'idle' ? 'waiting for you' : 'session has gone';
  const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  const dur = m => {                                     // how long the run took, if it took any time
    const s = Math.round(((m.until || m.at) - m.at) / 1000);
    return s < 5 ? '' : s < 90 ? ` over ${s}s` : ` over ${Math.round(s / 60)}m`;
  };
  const toolLine = m => {
    const top = Object.entries(m.names).sort((a, b) => b[1] - a[1]);
    const shown = top.slice(0, 3).map(([n, c]) => `${esc(n.replace(/^mcp__[^_]+__/, ''))}${
      c > 1 ? ` ×${c}` : ''}`).join(' · ');
    const rest = top.length - 3;
    return `<div class="m tools">⚙ ${m.n} tool call${m.n > 1 ? 's' : ''}${dur(m)} · ${shown}${
      rest > 0 ? ` · +${rest} more` : ''}</div>`;
  };
  const working = state === 'busy'
    ? `<div class="m working"><b>${esc(r.name)}</b> is working<i><span>.</span><span>.</span><span>.</span></i></div>`
    : '';
  const peerLine = m => `<div class="m peer"><i class=hd><b>${esc(m.from)}</b> → ${esc(r.name)} · ${
    ago(m.at)} ago</i>${md(m.text)}</div>`;
  const html = r.messages.map(m => m.role === 'tools' ? toolLine(m) : m.role === 'peer' ? peerLine(m) :
    `<div class="m ${m.role}"><i class=hd><b>${m.role === 'user' ? 'you' : esc(r.name)}</b> · ${
      ago(m.at)} ago</i>${md(m.text)}${
      m.cut ? '<span class=cut>… truncated — open the session to read the rest</span>' : ''}</div>`
  ).join('') + working;

  // Replacing innerHTML every 2s destroys the node the browser had anchored the scroll to, and its
  // re-anchoring guess walked the view down ~74px a poll - the thread crept downward while you read
  // it. Re-render only when something actually changed, and put the scroll back where it was.
  const sig = talkPid + '\u0000' + html;
  if (sig === threadSig) return;
  threadSig = sig;
  const top = box.scrollTop;
  box.innerHTML = html;
  box.scrollTop = atEnd ? box.scrollHeight : top;        // only follow if already at the end
}

function openTalk(pid, name) {
  talkPid = pid;
  threadSig = '';
  document.getElementById('talkto').textContent = name;
  document.getElementById('talklog').innerHTML = '';
  talkBox().classList.add('on');
  const t = document.getElementById('talktext');
  growTalk();
  t.focus(); t.setSelectionRange(t.value.length, t.value.length);
  loadThread();
  clearInterval(talkTimer); talkTimer = setInterval(loadThread, 2000);
}
function closeTalk() { talkPid = null; clearInterval(talkTimer); talkBox().classList.remove('on') }

// grow with the text, up to a third of the window - past that the composer would be eating the
// conversation it is a reply to, so it scrolls instead
function growTalk() {
  const t = document.getElementById('talktext');
  const max = Math.max(120, Math.round(window.innerHeight * 0.33));
  t.style.height = 'auto';                               // measure the content, not the last size
  t.style.height = Math.min(t.scrollHeight, max) + 'px';
}

async function sendTalk() {
  const t = document.getElementById('talktext'), text = t.value.trim(), pid = talkPid;
  if (!text || pid == null) return;
  t.value = ''; growTalk(); t.focus();                    // back to one line once it has gone
  const r = await (await fetch('/talk?pid=' + pid, { method: 'POST', body: text })).json();
  if (r.ok) { loadThread(); if (r.queued) toast('queued - session is mid-turn') }
  else { t.value = text; growTalk(); toast(`couldn't send: ${r.error}`) }
}
document.getElementById('talksend').addEventListener('click', e => { e.stopPropagation(); sendTalk() });
document.getElementById('talkclose').addEventListener('click', e => { e.stopPropagation(); closeTalk() });
document.getElementById('talktext').addEventListener('input', growTalk);
window.addEventListener('resize', () => { if (talkPid != null) growTalk() });
document.getElementById('talktext').addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeTalk();
  if (e.key !== 'Enter' || e.shiftKey) return;      // shift+enter for a newline while drafting
  e.preventDefault(); sendTalk();
});

document.addEventListener('click', async e => {
  const sb = e.target.closest('.talk');
  if (sb) {
    e.stopPropagation();
    const tile = sb.closest('.tile');
    return openTalk(+tile.dataset.pid, tile.querySelector('.name .txt')?.textContent || tile.dataset.pid);
  }
  const kb = e.target.closest('.kill');
  if (kb) {
    e.stopPropagation();
    const tile = kb.closest('.tile'), pid = tile.dataset.pid;
    const name = tile.querySelector('.name .txt')?.textContent || pid;
    if (!confirm(`Kill "${name}" (pid ${pid})?\n\nSends SIGTERM. The session stops immediately; `
               + `its transcript is kept but any work mid-turn is lost.`)) return;
    const r = await (await fetch('/kill?pid=' + pid, { method: 'POST' })).json();
    return toast(r.ok ? `SIGTERM sent to ${r.name}` : `couldn't kill: ${r.error}`);
  }
  const btn = e.target.closest('.cmd');
  if (btn) {
    e.stopPropagation();
    const pid = +btn.closest('.tile').dataset.pid, cmd = btn.dataset.cmd, key = pid + ':' + cmd;
    clearTimeout(armTimer);
    if (armed !== key) {                             // two-step: arm, then send
      armed = key; btn.classList.add('armed'); btn.textContent = `/${cmd}?`;
      armTimer = setTimeout(() => { armed = null }, 6000);   // next tick repaints the label
      return toast(`click again within 6s to send /${cmd}`);
    }
    armed = null; btn.classList.remove('armed'); btn.textContent = cmd;
    const r = await (await fetch(`/send?pid=${pid}&cmd=${cmd}`, { method: 'POST' })).json();
    return toast(r.ok ? `/${cmd} sent to ${r.app}${r.queued ? ' (queued - session is mid-turn)' : ''}`
                      : `couldn't send: ${r.error}`);
  }
  if (e.target.closest('details.more')) return;      // expanding is not a focus click
  const el = e.target.closest('.tile') || e.target.closest('#awaiting .a'); if (!el) return;
  if (!el.dataset.pid) {                            // a background job has no terminal to raise
    const cmd = `claude attach ${el.dataset.job}`;
    navigator.clipboard?.writeText(cmd).catch(() => {});
    return toast(`no terminal — copied: ${cmd}`);
  }
  const r = await (await fetch('/focus?pid=' + el.dataset.pid, { method: 'POST' })).json();
  toast(r.ok ? (r.exact ? `focused ${r.app} · ${r.tty}`
                        : `raised ${r.app} — find ${r.tty} (editor terminals aren't scriptable)`)
             : `couldn't focus: ${r.error}`);
});

tick(); setInterval(tick, 2000);
</script>
